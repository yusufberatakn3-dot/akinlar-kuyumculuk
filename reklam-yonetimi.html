<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Akınlar Kuyumculuk - Reklam Yönetimi</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}
body{padding:22px 16px 36px}
.wrap{max-width:620px;margin:0 auto}
h1{text-align:center;color:#ffd700;font-size:clamp(30px,7vw,42px);margin:12px 0 26px}
.card{border:1px solid #d4af37;border-radius:14px;padding:20px;background:#090909;margin-bottom:16px}
label{display:block;color:#ffd700;font-weight:700;margin:16px 0 8px}
input,select{display:block;width:100%;padding:14px;border:1px solid #b99b36;border-radius:9px;background:#111;color:#fff;font-size:17px}
button{border:0;border-radius:9px;padding:14px 16px;background:#d4af37;color:#000;font-size:17px;font-weight:800;width:100%;margin-top:14px}
button:disabled{opacity:.6}
.secondary{background:#222;color:#ffd700;border:1px solid #d4af37}
#loginView,#panelView{display:none}
#status{line-height:1.5;overflow-wrap:anywhere;margin-top:12px;font-weight:700}
#preview{display:none;width:100%;max-height:260px;object-fit:contain;background:#050505;margin-top:14px;border:1px solid #333;border-radius:8px}
.hint{color:#bbb;line-height:1.5;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:380px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>Akınlar Kuyumculuk<br>Reklam Yönetimi</h1>

<section id="loginView" class="card">
<h2 style="text-align:center;color:#ffd700;margin-top:0">Yönetici Girişi</h2>
<form id="loginForm">
<label for="password">Şifre</label>
<input id="password" type="password" autocomplete="current-password" placeholder="Şifrenizi girin" required>
<button type="submit">Giriş Yap</button>
</form>
<div id="loginStatus" role="status"></div>
</section>

<section id="panelView">
<div class="card">
<h2 style="color:#ffd700;margin-top:0">Yeni Reklam</h2>
<p class="hint">Görseli seç, önizle, yayın süresini belirle ve yayınla. Reklam, aynı Firebase veritabanını kullanan fiyat ekranında görünür.</p>

<label for="adFile">Reklam görseli</label>
<input id="adFile" type="file" accept="image/*">
<img id="preview" alt="Reklam önizlemesi">

<label for="duration">Yayın süresi</label>
<select id="duration">
<option value="15">15 dakika</option>
<option value="30">30 dakika</option>
<option value="60" selected>1 saat</option>
<option value="180">3 saat</option>
<option value="360">6 saat</option>
<option value="720">12 saat</option>
<option value="1440">24 saat</option>
</select>

<div class="row">
<button id="publish" type="button">Reklamı Yayınla</button>
<button id="remove" type="button" class="secondary">Reklamı Kaldır</button>
</div>
<div id="status" role="status"></div>
</div>

<div class="card">
<h2 style="color:#ffd700;margin-top:0">Yayındaki Reklam</h2>
<div id="currentStatus" class="hint">Reklam durumu kontrol ediliyor…</div>
<button id="logout" type="button" class="secondary">Çıkış Yap</button>
</div>
</section>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {getDatabase,ref,onValue,set,remove} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyD3qdvibbWYv_8QfTr2QCfqrn0cPFj2xKw",
 authDomain:"akinlar-kuyumculuk.firebaseapp.com",
 databaseURL:"https://akinlar-kuyumculuk-default-rtdb.firebaseio.com",
 projectId:"akinlar-kuyumculuk",
 storageBucket:"akinlar-kuyumculuk.firebasestorage.app",
 messagingSenderId:"615116794335",
 appId:"1:615116794335:web:f6928756d3a38b1e6dfc6a"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const adRef=ref(db,"reklam/current");
const $=id=>document.getElementById(id);
const ADMIN_PASSWORD="1532467980Bb.";
let selectedImage=null,currentAd=null;

$("loginView").style.display="block";

$("loginForm").addEventListener("submit",e=>{
 e.preventDefault();
 if($("password").value===ADMIN_PASSWORD){
  sessionStorage.setItem("reklam_yonetim_oturumu","1");
  showPanel();
 }else{
  $("loginStatus").textContent="Şifre yanlış. Tekrar deneyin.";
 }
});

function showPanel(){
 $("loginView").style.display="none";
 $("panelView").style.display="block";
}

if(sessionStorage.getItem("reklam_yonetim_oturumu")==="1")showPanel();

onValue(adRef,s=>{
 currentAd=s.val();
 if(!currentAd?.imageData||!currentAd?.expiresAt||Date.now()>=Number(currentAd.expiresAt)){
  $("currentStatus").textContent="Şu anda yayında reklam yok.";
 }else{
  const remaining=Math.max(0,Math.ceil((Number(currentAd.expiresAt)-Date.now())/60000));
  $("currentStatus").textContent="Reklam yayında. Yaklaşık "+remaining+" dakika sonra sona erecek.";
 }
},err=>{
 $("currentStatus").textContent="Reklam durumu okunamadı: "+err.message;
});

function compressImage(file){
 return new Promise((resolve,reject)=>{
  if(!file.type.startsWith("image/"))return reject(Error("Lütfen bir görsel dosyası seç."));
  const reader=new FileReader();
  reader.onerror=()=>reject(Error("Dosya okunamadı."));
  reader.onload=()=>{
   const img=new Image();
   img.onerror=()=>reject(Error("Görsel açılamadı."));
   img.onload=()=>{
    const scale=Math.min(1,1000/Math.max(img.width,img.height));
    const canvas=document.createElement("canvas");
    canvas.width=Math.max(1,Math.round(img.width*scale));
    canvas.height=Math.max(1,Math.round(img.height*scale));
    const ctx=canvas.getContext("2d");
    if(!ctx)return reject(Error("Görsel işlenemedi."));
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    const data=canvas.toDataURL("image/jpeg",0.65);
    if(data.length>850000)reject(Error("Görsel çok büyük. Daha küçük bir görsel seç."));
    else resolve(data);
   };
   img.src=reader.result;
  };
  reader.readAsDataURL(file);
 });
}

$("adFile").addEventListener("change",async e=>{
 const file=e.target.files?.[0];
 if(!file)return;
 $("status").textContent="Görsel hazırlanıyor…";
 try{
  selectedImage=await compressImage(file);
  $("preview").src=selectedImage;
  $("preview").style.display="block";
  $("status").textContent="Önizleme hazır. Yayınlamadan önce kontrol edin.";
 }catch(err){
  selectedImage=null;
  $("preview").style.display="none";
  $("status").textContent=err.message;
 }
});

$("publish").addEventListener("click",async()=>{
 if(!selectedImage){
  $("status").textContent="Önce reklam görseli seç.";
  return;
 }
 const minutes=Number($("duration").value);
 $("publish").disabled=true;
 $("remove").disabled=true;
 $("status").textContent="Reklam yayınlanıyor…";
 try{
  const now=Date.now();
  await set(adRef,{
   imageData:selectedImage,
   publishedAt:now,
   expiresAt:now+minutes*60000,
   durationMinutes:minutes
  });
  $("status").textContent="Reklam yayınlandı. Fiyat ekranında görünmesi gerekir.";
 }catch(err){
  $("status").textContent="Yayınlanamadı: "+err.message+". Firebase veritabanı yazma izinlerini kontrol edin.";
 }finally{
  $("publish").disabled=false;
  $("remove").disabled=false;
 }
});

$("remove").addEventListener("click",async()=>{
 if(!confirm("Yayındaki reklam kaldırılsın mı?"))return;
 $("remove").disabled=true;
 $("publish").disabled=true;
 try{
  await remove(adRef);
  $("status").textContent="Reklam kaldırıldı.";
  selectedImage=null;
  $("adFile").value="";
  $("preview").removeAttribute("src");
  $("preview").style.display="none";
 }catch(err){
  $("status").textContent="Reklam kaldırılamadı: "+err.message;
 }finally{
  $("remove").disabled=false;
  $("publish").disabled=false;
 }
});

$("logout").addEventListener("click",()=>{
 sessionStorage.removeItem("reklam_yonetim_oturumu");
 $("password").value="";
 $("panelView").style.display="none";
 $("loginView").style.display="block";
 $("loginStatus").textContent="";
});
</script>
</body>
</html>
