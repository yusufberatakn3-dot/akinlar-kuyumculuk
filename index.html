*{margin:0;padding:0;box-sizing:border-box}
body{
background:radial-gradient(circle at top,#2b2300,#000 45%);
color:white;
font-family:Arial,sans-serif;
overflow:hidden;
padding:8px;
}

.top{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:6px;
margin-bottom:8px;
}

.box{
border:1.5px solid #d4af37;

font-weight:bold;

background:rgba(0,0,0,.55);
}

.logo{
position:relative;
overflow:hidden;
text-align:center;
font-size:34px;
font-weight:900;
color:#ffd700;
text-shadow:0 0 12px #ffd700,0 0 25px #9b7b00;
margin:10px 0 3px;
white-space:nowrap;
}

.logo:after{
content:"";
position:absolute;
top:0;
left:-70%;
width:45%;
height:100%;
background:linear-gradient(110deg,transparent,rgba(255,255,255,.85),transparent);
animation:shine 5s infinite;
}

@keyframes shine{
0%{left:-70%}
25%{left:120%}
100%{left:120%}
}

.sub{
text-align:center;
font-size:13px;
letter-spacing:4px;
font-weight:bold;
margin-bottom:9px;
color:#eee;
}

table{
width:100%;

border:1.5px solid #d4af37;
background:#030303;
}

th{
background:linear-gradient(#ffe36a,#caa000);
color:#000;
font-size:20px;
padding:9px;
}

td{
border:1px solid rgba(255,215,0,.28);
padding:8px 10px;
font-size:17px;
font-weight:bold;
}

td:not(:first-child){
text-align:center;
}

.gold{
color:#ffd700;
}

.white{
color:#ffffff;
}

.footer{

bottom:0;
left:0;
width:100%;

color:#ffd700;
font-weight:bold;
padding:8px;
font-size:16px;
overflow:hidden;
white-space:nowrap;
}
