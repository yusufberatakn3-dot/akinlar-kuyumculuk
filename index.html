<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKINLAR KUYUMCULUK</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
background:#000;
color:#fff;
font-family:Arial,sans-serif;
padding:10px;
}

.top{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:8px;
margin-bottom:15px;
}

.box{
border:2px solid #d4af37;
padding:12px;
text-align:center;
font-weight:bold;
font-size:22px;
}

.logo{
text-align:center;
font-size:54px;
font-weight:bold;
color:#ffd700;
text-shadow:0 0 20px #ffd700;
margin:20px 0 5px;
}

.sub{
text-align:center;
font-size:18px;
letter-spacing:6px;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#d4af37;
color:#000;
font-size:22px;
padding:15px;
}

td{
border:1px solid #444;
padding:16px;
font-size:20px;
}

tr:nth-child(even){
background:#050505;
}

.old{
color:#ffd700;
font-weight:bold;
}

.new{
color:#3b82f6;
font-weight:bold;
}

.footer{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#000;
border-top:2px solid #d4af37;
color:#ffd700;
font-weight:bold;
padding:10px;
overflow:hidden;
white-space:nowrap;
}

.marquee{
display:inline-block;
padding-left:100%;
animation:kaydir 20s linear infinite;
}

@keyframes kaydir{
0%{transform:translateX(0)}
100%{transform:translateX(-100%)}
}
</style>
</head>

<body>

<div class="top">
<div class="box" id="saat">00:00:00</div>
<div class="box">09 Haziran 2026</div>
<div class="box">Son Güncelleme<br>-</div>
</div>

<div class="logo">AKINLAR KUYUMCULUK</div>
<div class="sub">ALTIN & DÖVİZ FİYATLARI</div>

<table>
<tr>
<th>ÜRÜN</th>
<th>ALIŞ</th>
<th>SATIŞ</th>
</tr>

<tr><td>Has Altın</td><td>-</td><td>-</td></tr>
<tr><td>Gram Altın</td><td>-</td><td>-</td></tr>
<tr><td>22 Ayar Gram</td><td>-</td><td>-</td></tr>

<tr><td class="old">Çeyrek Eski</td><td>-</td><td>-</td></tr>
<tr><td class="new">Çeyrek Yeni</td><td>-</td><td>-</td></tr>

<tr><td class="old">Yarım Eski</td><td>-</td><td>-</td></tr>
<tr><td class="new">Yarım Yeni</td><td>-</td><td>-</td></tr>

<tr><td class="old">Tam Eski</td><td>-</td><td>-</td></tr>
<tr><td class="new">Tam Yeni</td><td>-</td><td>-</td></tr>

<tr><td>Dolar</td><td>-</td><td>-</td></tr>
<tr><td>Euro</td><td>-</td><td>-</td></tr>
</table>

<div style="height:60px"></div>

<div class="footer">
<div class="marquee">
AKINLAR KUYUMCULUK • ALTIN VE DÖVİZ FİYATLARI • ŞANLIURFA
</div>
</div>

<script>
function saatGuncelle(){
const now=new Date();
document.getElementById("saat").innerHTML=
now.toLocaleTimeString("tr-TR");
}
setInterval(saatGuncelle,1000);
saatGuncelle();
</script>

</body>
</html>
