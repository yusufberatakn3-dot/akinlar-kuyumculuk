<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akınlar Kuyumculuk</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  padding:10px;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:radial-gradient(circle at top,#332900 0%,#050505 45%,#000 100%);
  z-index:-1;
}

.top{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

.box{
  border:2px solid #d4af37;
  border-radius:6px;
  padding:8px 4px;
  text-align:center;
  font-size:16px;
  font-weight:bold;
  background:rgba(0,0,0,.6);
}

.logo{
  position:relative;
  overflow:hidden;
  text-align:center;
  color:#ffd700;
  font-size:34px;
  font-weight:900;
  white-space:nowrap;
  text-shadow:0 0 12px #ffd700,0 0 28px #8a6d00;
  margin:12px 0 5px;
}

.logo::after{
  content:"";
  position:absolute;
  top:0;
  left:-60%;
  width:45%;
  height:100%;
  background:linear-gradient(110deg,transparent,rgba(255,255,255,.9),transparent);
  animation:shine 5s infinite;
}

@keyframes shine{
  0%{left:-60%}
  25%{left:120%}
  100%{left:120%}
}

.sub{
  text-align:center;
  font-size:13px;
  letter-spacing:4px;
  font-weight:bold;
  margin-bottom:10px;
}

table{
  width:100%;
  border-collapse:collapse;
  border:2px solid #d4af37;
  background:#020202;
}

th{
  background:linear-gradient(#ffe36a,#caa000);
  color:#000;
  font-size:20px;
  padding:10px 4px;
}

td{
  border:1px solid rgba(255,215,0,.28);
  padding:8px 10px;
  font-size:17px;
  font-weight:bold;
}

td:not(:first-child){
  text-align:center;
}

.gold{color:#ffd700}

.footer-space{height:50px}

.footer{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:42px;
  background:#000;
  border-top:2px solid #d4af37;
  color:#ffd700;
  font-size:16px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  display:flex;
  align-items:center;
}

.marquee{
  display:inline-block;
  padding-left:100%;
  animation:marquee 18s linear infinite;
}

@keyframes marquee{
  from{transform:translateX(0)}
  to{transform:translateX(-100%)}
}
</style>
</head>

<body>

<div class="top">
  <div class="box" id="saat">00:00:00</div>
  <div class="box" id="tarih">--</div>
  <div class="box">Son Güncelleme<br><span id="sonGuncelleme">-</span></div>
</div>

<div class="logo">AKINLAR KUYUMCULUK</div>
<div class="sub">ALTIN & DÖVİZ FİYATLARI</div>

<table>
  <tr><th>ÜRÜN</th><th>ALIŞ</th><th>SATIŞ</th></tr>

  <tr><td>Has Altın</td><td id="hasAltinAlis">-</td><td id="hasAltinSatis">-</td></tr>
  <tr><td>Gram Altın</td><td id="gramAltinAlis">-</td><td id="gramAltinSatis">-</td></tr>
  <tr><td>22 Ayar Gram</td><td id="ayar22Alis">-</td><td id="ayar22Satis">-</td></tr>

  <tr><td class="gold">Çeyrek Eski</td><td id="ceyrekEskiAlis">-</td><td id="ceyrekEskiSatis">-</td></tr>
  <tr><td>Çeyrek Yeni</td><td id="ceyrekYeniAlis">-</td><td id="ceyrekYeniSatis">-</td></tr>

  <tr><td class="gold">Yarım Eski</td><td id="yarimEskiAlis">-</td><td id="yarimEskiSatis">-</td></tr>
  <tr><td>Yarım Yeni</td><td id="yarimYeniAlis">-</td><td id="yarimYeniSatis">-</td></tr>

  <tr><td class="gold">Tam Eski</td><td id="tamEskiAlis">-</td><td id="tamEskiSatis">-</td></tr>
  <tr><td>Tam Yeni</td><td id="tamYeniAlis">-</td><td id="tamYeniSatis">-</td></tr>

  <tr><td>Dolar</td><td id="dolarAlis">-</td><td id="dolarSatis">-</td></tr>
  <tr><td>Euro</td><td id="euroAlis">-</td><td id="euroSatis">-</td></tr>
</table>

<div class="footer-space"></div>

<div class="footer">
  <div class="marquee">
    AKINLAR KUYUMCULUK • ALTIN VE DÖVİZ FİYATLARI ANLIK OLARAK DEĞİŞEBİLİR • ŞANLIURFA
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD3qdvibbWYv_8QfTr2QCfqrn0cPFj2xKw",
  authDomain: "akinlar-kuyumculuk.firebaseapp.com",
  databaseURL: "https://akinlar-kuyumculuk-default-rtdb.firebaseio.com",
  projectId: "akinlar-kuyumculuk",
  storageBucket: "akinlar-kuyumculuk.firebasestorage.app",
  messagingSenderId: "615116794335",
  appId: "1:615116794335:web:f6928756d3a38b1e6dfc6a"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const products = [
  "hasAltin",
  "gramAltin",
  "ayar22",
  "ceyrekEski",
  "ceyrekYeni",
  "yarimEski",
  "yarimYeni",
  "tamEski",
  "tamYeni",
  "dolar",
  "euro"
];

onValue(ref(db,"fiyatlar"), snap=>{
  const data = snap.val() || {};
  products.forEach(key=>{
    if(data[key]){
      const alis = document.getElementById(key+"Alis");
      const satis = document.getElementById(key+"Satis");
      if(alis) alis.textContent = data[key].alis || "-";
      if(satis) satis.textContent = data[key].satis || "-";
    }
  });
});

onValue(ref(db,"sonGuncelleme"), snap=>{
  const val = snap.val();
  if(val){
    document.getElementById("sonGuncelleme").textContent = val;
  }
});
</script>

<script>
function guncelle(){
  const n = new Date();

  document.getElementById("saat").textContent =
    n.toLocaleTimeString("tr-TR");

  document.getElementById("tarih").innerHTML =
    n.toLocaleDateString("tr-TR",{
      day:"2-digit",
      month:"long",
      year:"numeric"
    });
}

guncelle();
setInterval(guncelle,1000);
</script>

</body>
</html>
