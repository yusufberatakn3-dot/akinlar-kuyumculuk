<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKINLAR KUYUMCULUK</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
background:radial-gradient(circle at top,#2b2300,#000 45%);
color:white;
font-family:Arial,sans-serif;
overflow:hidden;
padding:8px;
}

.top{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:6px;
margin-bottom:8px;
}
.box{
border:1.5px solid #d4af37;
padding:7px;
text-align:center;
font-weight:bold;
font-size:16px;
border-radius:5px;
}

.logo{
position:relative;
overflow:hidden;
text-align:center;
font-size:34px;
font-weight:900;
color:#ffd700;
text-shadow:0 0 12px #ffd700,0 0 25px #9b7b00;
margin:10px 0 3px;
white-space:nowrap;
}
.logo:after{
content:"";
position:absolute;
top:0;
left:-70%;
width:45%;
height:100%;
background:linear-gradient(110deg,transparent,rgba(255,255,255,.9),transparent);
animation:shine 5s infinite;
}
@keyframes shine{
0%{left:-70%}
25%{left:120%}
100%{left:120%}
}

.sub{
text-align:center;
font-size:13px;
letter-spacing:4px;
font-weight:bold;
margin-bottom:9px;
}

table{
width:100%;
border-collapse:collapse;
border:1.5px solid #d4af37;
}
th{
background:linear-gradient(#ffe36a,#caa000);
color:#000;
font-size:20px;
padding:9px;
}
td{
border:1px solid rgba(255,215,0,.28);
padding:8px 10px;
font-size:17px;
font-weight:bold;
}
td:not(:first-child){
text-align:center;
}
.old{color:#ffd700}
.new{color:#4f91ff}

.footer{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#000;
border-top:2px solid #d4af37;
color:#ffd700;
font-weight:bold;
padding:8px;
font-size:16px;
overflow:hidden;
white-space:nowrap;
}
.marquee{
display:inline-block;
padding-left:100%;
animation:kaydir 18s linear infinite;
}
@keyframes kaydir{
0%{transform:translateX(0)}
100%{transform:translateX(-100%)}
}
</style>
</head>

<body>

<div class="top">
<div class="box" id="saat">00:00:00</div>
<div class="box" id="tarih">--</div>
<div class="box">Son Güncelleme<br>-</div>
</div>

<div class="logo">AKINLAR KUYUMCULUK</div>
<div class="sub">ALTIN & DÖVİZ FİYATLARI</div>

<table>
<tr><th>ÜRÜN</th><th>ALIŞ</th><th>SATIŞ</th></tr>
<tr><td>Has Altın</td><td>-</td><td>-</td></tr>
<tr><td>Gram Altın</td><td>-</td><td>-</td></tr>
<tr><td>22 Ayar Gram</td><td>-</td><td>-</td></tr>
<tr><td class="old">Çeyrek Eski</td><td>-</td><td>-</td></tr>
<tr><td class="new">Çeyrek Yeni</td><td>-</td><td>-</td></tr>
<tr><td class="old">Yarım Eski</td><td>-</td><td>-</td></tr>
<tr><td class="new">Yarım Yeni</td><td>-</td><td>-</td></tr>
<tr><td class="old">Tam Eski</td><td>-</td><td>-</td></tr>
<tr><td class="new">Tam Yeni</td><td>-</td><td>-</td></tr>
<tr><td>Dolar</td><td>-</td><td>-</td></tr>
<tr><td>Euro</td><td>-</td><td>-</td></tr>
</table>

<div class="footer">
<div class="marquee">AKINLAR KUYUMCULUK • ALTIN VE DÖVİZ FİYATLARI ANLIK OLARAK DEĞİŞEBİLİR • ŞANLIURFA</div>
</div>

<script>
function guncelle(){
const n=new Date();
document.getElementById("saat").innerHTML=n.toLocaleTimeString("tr-TR");
document.getElementById("tarih").innerHTML=n.toLocaleDateString("tr-TR",{
day:"2-digit",month:"long",year:"numeric"
});
}
setInterval(guncelle,1000);
guncelle();
</script>

</body>
</html>
