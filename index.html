<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akınlar Kuyumculuk</title>

<style>
body{
margin:0;
background:#000;
font-family:Arial,sans-serif;
color:white;
}

.header{
text-align:center;
padding:20px;
}

.logo{
font-size:42px;
font-weight:bold;
color:#ffd700;
text-shadow:0 0 20px #ffd700;
}

.sub{
font-size:18px;
letter-spacing:4px;
margin-top:10px;
}

.table{
width:95%;
margin:auto;
border:2px solid #d4af37;
border-radius:20px;
overflow:hidden;
}

.head{
display:grid;
grid-template-columns:2fr 1fr 1fr;
background:#d4af37;
color:#000;
font-weight:bold;
font-size:28px;
}

.head div{
padding:15px;
text-align:center;
}

.row{
display:grid;
grid-template-columns:2fr 1fr 1fr;
border-top:1px solid #333;
}

.row div{
padding:18px;
font-size:24px;
}

.buy,.sell{
text-align:center;
}

.old{
color:#ffd700;
font-weight:bold;
}

.new{
color:#4a8cff;
font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
<div class="logo">AKINLAR KUYUMCULUK</div>
<div class="sub">ALTIN & DÖVİZ FİYATLARI</div>
</div>

<div class="table">

<div class="head">
<div>ÜRÜN</div>
<div>ALIŞ</div>
<div>SATIŞ</div>
</div>

<div class="row"><div>Has Altın</div><div class="buy">-</div><div class="sell">-</div></div>
<div class="row"><div>Gram Altın</div><div class="buy">-</div><div class="sell">-</div></div>
<div class="row"><div>22 Ayar Gram</div><div class="buy">-</div><div class="sell">-</div></div>
<div class="row"><div class="old">Çeyrek Eski</div><div>-</div><div>-</div></div>
<div class="row"><div class="new">Çeyrek Yeni</div><div>-</div><div>-</div></div>
<div class="row"><div class="old">Yarım Eski</div><div>-</div><div>-</div></div>
<div class="row"><div class="new">Yarım Yeni</div><div>-</div><div>-</div></div>
<div class="row"><div class="old">Tam Eski</div><div>-</div><div>-</div></div>
<div class="row"><div class="new">Tam Yeni</div><div>-</div><div>-</div></div>
<div class="row"><div>Dolar</div><div>-</div><div>-</div></div>
<div class="row"><div>Euro</div><div>-</div><div>-</div></div>

</div>

</body>
</html>
