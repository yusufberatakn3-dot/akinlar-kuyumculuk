<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akınlar Kuyumculuk</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
color:white;
font-family:Arial,sans-serif;
overflow:hidden;
}

.header{
padding:10px;
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:5px;
}

.box{
border:2px solid #d4af37;
padding:8px;
text-align:center;
font-weight:bold;
}

.logo{
text-align:center;
font-size:48px;
font-weight:bold;
color:#ffd700;
text-shadow:0 0 15px #ffd700;
margin-top:10px;
}

.sub{
text-align:center;
letter-spacing:5px;
margin-bottom:20px;
}

table{
width:95%;
margin:auto;
border-collapse:collapse;
}

th{
background:#d4af37;
color:black;
font-size:28px;
padding:12px;
}

td{
border:1px solid rgba(255,215,0,.3);
padding:14px;
font-size:22px;
font-weight:bold;
text-align:center;
}

td:first-child{
text-align:left;
padding-left:25px;
}

.old{
color:#ffd700;
}

.new{
color:#3b82f6;
}

.ticker{
position:fixed;
bottom:0;
left:0;
width:100%;
background:black;
border-top:2px solid #d4af37;
color:#ffd700;
padding:10px;
font-size:20px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
}

.marquee{
display:inline-block;
padding-left:100%;
animation:kay 20s linear infinite;
}

@keyframes kay{
0%{transform:translateX(0)}
100%{transform:translateX(-100%)}
}
</style>
</head>

<body>

<div class="header">
<div class="box" id="clock"></div>
<div class="box" id="date"></div>
<div class="box">
Son Güncelleme
<br>
-
</div>
</div>

<div class="logo">
AKINLAR KUYUMCULUK
</div>

<div class="sub">
ALTIN & DÖVİZ FİYATLARI
</div>

<table>
<tr>
<th>ÜRÜN</th>
<th>ALIŞ</th>
<th>SATIŞ</th>
</tr>

<tr><td>Has Altın</td><td>-</td><td>-</td></tr>
<tr><td>Gram Altın</td><td>-</td><td>-</td></tr>
<tr><td>22 Ayar Gram</td><td>-</td><td>-</td></tr>

<tr><td class="old">Çeyrek Eski</td><td>-</td><td>-</td></tr>
<tr><td class="new">Çeyrek Yeni</td><td>-</td><td>-</td></tr>

<tr><td class="old">Yarım Eski</td><td>-</td><td>-</td></tr>
<tr><td class="new">Yarım Yeni</td><td>-</td><td>-</td></tr>

<tr><td class="old">Tam Eski</td><td>-</td><td>-</td></tr>
<tr><td class="new">Tam Yeni</td><td>-</td><td>-</td></tr>

<tr><td>Dolar</td><td>-</td><td>-</td></tr>
<tr><td>Euro</td><td>-</td><td>-</td></tr>

</table>

<div class="ticker">
<div class="marquee">
AKINLAR KUYUMCULUK • ALTIN VE DÖVİZ FİYATLARI • ŞANLIURFA
</div>
</div>

<script>
function updateClock(){
const now=new Date();

document.getElementById("clock").innerHTML=
now.toLocaleTimeString("tr-TR");

document.getElementById("date").innerHTML=
now.toLocaleDateString("tr-TR",{
day:"2-digit",
month:"long",
year:"numeric"
});
}

setInterval(updateClock,1000);
updateClock();
</script>

</body>
</html>
