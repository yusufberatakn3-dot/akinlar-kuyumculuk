<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akınlar Kuyumculuk Kar Paneli</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
background:#000;
color:white;
font-family:Arial,sans-serif;
padding:15px;
}
h1{
color:#ffd700;
text-align:center;
margin-bottom:15px;
}
.login,.panel{
max-width:650px;
margin:auto;
}
input{
width:100%;
padding:12px;
margin:6px 0;
font-size:18px;
border:1px solid #d4af37;
border-radius:6px;
background:#111;
color:#fff;
}
button{
width:100%;
padding:14px;
margin-top:10px;
background:#d4af37;
color:#000;
border:0;
border-radius:8px;
font-size:18px;
font-weight:bold;
}
.row{
display:grid;
grid-template-columns:1.4fr 1fr 1fr;
gap:6px;
margin-bottom:8px;
align-items:center;
}
.label{
font-weight:bold;
color:#ffd700;
}
.panel{display:none}
.info{
color:#ccc;
font-size:14px;
margin-bottom:15px;
text-align:center;
}
</style>
</head>

<body>

<div class="login" id="login">
<h1>Yönetici Girişi</h1>
<input id="password" type="password" placeholder="Şifre">
<button onclick="login()">Giriş Yap</button>
</div>

<div class="panel" id="panel">
<h1>Kar Yönetimi</h1>
<div class="info">Buraya fiyat değil, canlı fiyatın üstüne eklenecek karı yaz.</div>
<div id="inputs"></div>
<button onclick="saveMargins()">Karları Kaydet</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyD3qdvibbWYv_8QfTr2QCfqrn0cPFj2xKw",
authDomain: "akinlar-kuyumculuk.firebaseapp.com",
databaseURL: "https://akinlar-kuyumculuk-default-rtdb.firebaseio.com",
projectId: "akinlar-kuyumculuk",
storageBucket: "akinlar-kuyumculuk.firebasestorage.app",
messagingSenderId: "615116794335",
appId: "1:615116794335:web:f6928756d3a38b1e6dfc6a"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const products = [
["hasAltin","Has Altın"],
["gramAltin","Gram Altın"],
["ayar22","22 Ayar Gram"],
["ceyrekEski","Çeyrek Eski"],
["ceyrekYeni","Çeyrek Yeni"],
["yarimEski","Yarım Eski"],
["yarimYeni","Yarım Yeni"],
["tamEski","Tam Eski"],
["tamYeni","Tam Yeni"],
["dolar","Dolar"],
["euro","Euro"]
];

window.login=function(){
if(document.getElementById("password").value==="1234"){
document.getElementById("login").style.display="none";
document.getElementById("panel").style.display="block";
buildInputs();
}else{
alert("Şifre yanlış");
}
}

function buildInputs(){
const area=document.getElementById("inputs");
area.innerHTML="";

products.forEach(([key,name])=>{
area.innerHTML+=`
<div class="row">
<div class="label">${name}</div>
<input id="${key}AlisKar" placeholder="Alış karı">
<input id="${key}SatisKar" placeholder="Satış karı">
</div>`;
});

onValue(ref(db,"karlar"),snap=>{
const data=snap.val()||{};
products.forEach(([key])=>{
if(data[key]){
document.getElementById(key+"AlisKar").value=data[key].alis||"";
document.getElementById(key+"SatisKar").value=data[key].satis||"";
}
});
});
}

window.saveMargins=function(){
const data={};

products.forEach(([key])=>{
data[key]={
alis:document.getElementById(key+"AlisKar").value||"0",
satis:document.getElementById(key+"SatisKar").value||"0"
};
});

set(ref(db,"karlar"),data);
set(ref(db,"sonGuncelleme"),new Date().toLocaleString("tr-TR"));
alert("Karlar kaydedildi");
}
</script>

</body>
</html>
