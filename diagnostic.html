<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akınlar Kuyumculuk - Tam Sistem Teşhis</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:18px;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
}

h1{
  color:#ffd700;
  margin:0 0 8px;
}

#durum{
  color:#aaa;
  margin-bottom:18px;
}

.kutu{
  background:#1b1b1b;
  border:1px solid #444;
  border-radius:13px;
  padding:15px;
  margin:10px 0;
}

.ok{
  border-color:#22c55e;
}

.hata{
  border-color:#ef4444;
}

.uyari{
  border-color:#f59e0b;
}

.baslik{
  font-size:18px;
  font-weight:bold;
  margin-bottom:8px;
}

.detay{
  color:#ddd;
  line-height:1.6;
  word-break:break-word;
}

.sonuc{
  background:#202020;
  border:2px solid #ffd700;
  border-radius:13px;
  padding:18px;
  margin-top:18px;
  line-height:1.7;
}

button{
  width:100%;
  padding:16px;
  margin-top:12px;
  border:0;
  border-radius:11px;
  background:#ffd700;
  color:#111;
  font-size:17px;
  font-weight:bold;
}

iframe{
  display:none;
}
</style>
</head>

<body>

<h1>🔧 Akınlar Kuyumculuk</h1>

<div id="durum">
Sistem kontrol ediliyor...
</div>

<div id="sonuclar"></div>

<iframe id="testFrame"></iframe>

<button onclick="baslat()">
🔄 Tekrar Kontrol Et
</button>


<script>

const sonucAlani =
document.getElementById("sonuclar");

const durum =
document.getElementById("durum");

const frame =
document.getElementById("testFrame");


let ilkSorun = null;

function sorun(dosya){
  if(!ilkSorun){
    ilkSorun = dosya;
  }
}


function kutu(baslik,tur,detay){

  let ikon = "🟢";

  if(tur === "hata"){
    ikon = "🔴";
  }

  if(tur === "uyari"){
    ikon = "🟡";
  }

  return `
    <div class="kutu ${tur}">
      <div class="baslik">
        ${ikon} ${baslik}
      </div>

      <div class="detay">
        ${detay}
      </div>
    </div>
  `;
}


/* =====================================================
   API TESTİ
===================================================== */

async function apiTest(){

  try{

    const cevap = await fetch(
      "/api/sukob?diagnostic=" + Date.now(),
      {
        cache:"no-store"
      }
    );

    const metin =
      await cevap.text();

    if(!cevap.ok){

      sorun("api/sukob.js");

      return kutu(
        "Vercel API",
        "hata",
        `
        <b>HTTP:</b> ${cevap.status}<br><br>

        <b>SORUNUN YERİ:</b><br>
        api/sukob.js<br><br>

        <b>YAPILACAK:</b><br>
        SUKOB bağlantısı kontrol edilmeli.<br><br>

        <b>Sunucu cevabı:</b><br>
        ${metin.substring(0,700)}
        `
      );
    }

    let veri;

    try{

      veri =
        JSON.parse(metin);

    }catch(e){

      sorun("api/sukob.js");

      return kutu(
        "SUKOB JSON",
        "hata",
        `
        API cevap verdi fakat JSON okunamadı.<br><br>

        <b>SORUNUN YERİ:</b>
        api/sukob.js
        `
      );
    }

    window.sukob = veri;

    return kutu(
      "Vercel API",
      "ok",
      `
      <b>/api/sukob</b> çalışıyor.<br>
      JSON başarıyla alındı.
      `
    );

  }catch(e){

    sorun("api/sukob.js");

    return kutu(
      "Vercel API",
      "hata",
      `
      <b>HATA:</b> ${e.message}<br><br>

      <b>SORUNUN YERİ:</b>
      api/sukob.js
      `
    );
  }
}


/* =====================================================
   SUKOB ÜRÜNLERİ
===================================================== */

function sukobUrunTest(){

  const veri = window.sukob;

  if(!veri){

    return kutu(
      "SUKOB ürünleri",
      "hata",
      "API verisi olmadığı için ürünler kontrol edilemedi."
    );
  }

  const urunler = {

    hasAltin:"HAS Altın",
    ayar22:"22 Ayar Bilezik",
    yeniCeyrek:"Yeni Çeyrek",
    yeniYarim:"Yeni Yarım",
    yeniTam:"Yeni Ziynet",
    eskiCeyrek:"Eski Çeyrek",
    eskiYarim:"Eski Yarım",
    eskiTam:"Eski Ziynet",
    dolar:"USD",
    euro:"EUR"

  };

  let eksik=[];
  let bozuk=[];

  for(const key in urunler){

    const urun = veri[key];

    if(!urun){

      eksik.push(urunler[key]);

      continue;
    }

    const alis =
      Number(urun.buyPrice);

    const satis =
      Number(urun.sellPrice);

    if(
      !Number.isFinite(alis) ||
      !Number.isFinite(satis)
    ){

      bozuk.push(urunler[key]);
    }
  }

  if(eksik.length){

    sorun("api/sukob.js");

    return kutu(
      "SUKOB ürünleri",
      "hata",
      `
      <b>Eksik:</b><br>
      ${eksik.join("<br>")}<br><br>

      <b>SORUNUN YERİ:</b>
      api/sukob.js
      `
    );
  }

  if(bozuk.length){

    sorun("api/sukob.js");

    return kutu(
      "SUKOB fiyatları",
      "hata",
      `
      <b>Geçersiz:</b><br>
      ${bozuk.join("<br>")}<br><br>

      <b>SORUNUN YERİ:</b>
      api/sukob.js
      `
    );
  }

  return kutu(
    "SUKOB ürünleri",
    "ok",
    `
    10 ürünün tamamı geldi.<br>
    Alış ve satış fiyatları sayısal.
    `
  );
}


/* =====================================================
   FIREBASE TESTİ
===================================================== */

async function firebaseTest(){

  try{

    const cevap =
      await fetch(
        "https://akinlar-kuyumculuk-default-rtdb.firebaseio.com/karlar.json?diagnostic=" + Date.now(),
        {
          cache:"no-store"
        }
      );

    if(!cevap.ok){

      sorun("Firebase / index.html");

      return kutu(
        "Firebase",
        "hata",
        `
        <b>HTTP:</b> ${cevap.status}<br><br>

        <b>SORUNUN YERİ:</b>
        Firebase / index.html<br><br>

        <b>YAPILACAK:</b>
        Firebase bağlantısı ve erişim kontrol edilmeli.
        `
      );
    }

    const veri =
      await cevap.json();

    window.firebaseKarlar = veri;

    if(!veri){

      return kutu(
        "Firebase karlar",
        "uyari",
        `
        Firebase'e bağlanıldı fakat
        <b>karlar</b> alanı boş görünüyor.
        `
      );
    }

    return kutu(
      "Firebase bağlantısı",
      "ok",
      `
      Firebase bağlantısı başarılı.<br>
      <b>karlar</b> verisi bulundu.
      `
    );

  }catch(e){

    sorun("Firebase / index.html");

    return kutu(
      "Firebase",
      "hata",
      `
      <b>HATA:</b> ${e.message}<br><br>

      <b>SORUNUN YERİ:</b>
      Firebase / index.html
      `
    );
  }
}


/* =====================================================
   INDEX.HTML KONTROLÜ
===================================================== */

async function indexTest(){

  try{

    const cevap =
      await fetch(
        "/index.html?diagnostic=" + Date.now(),
        {
          cache:"no-store"
        }
      );

    if(!cevap.ok){

      sorun("index.html");

      return kutu(
        "index.html",
        "hata",
        `
        <b>HTTP:</b> ${cevap.status}<br><br>

        <b>SORUNUN YERİ:</b>
        index.html
        `
      );
    }

    const html =
      await cevap.text();

    window.indexKod = html;

    const gerekenler = [

      "hasAltinAlis",
      "hasAltinSatis",

      "ayar22Alis",
      "ayar22Satis",

      "ceyrekEskiAlis",
      "ceyrekEskiSatis",

      "ceyrekYeniAlis",
      "ceyrekYeniSatis",

      "yarimEskiAlis",
      "yarimEskiSatis",

      "yarimYeniAlis",
      "yarimYeniSatis",

      "tamEskiAlis",
      "tamEskiSatis",

      "tamYeniAlis",
      "tamYeniSatis",

      "dolarAlis",
      "dolarSatis",

      "euroAlis",
      "euroSatis"

    ];

    const eksik =
      gerekenler.filter(
        id =>
          !html.includes(`id="${id}"`) &&
          !html.includes(`id='${id}'`)
      );

    if(eksik.length){

      sorun("index.html");

      return kutu(
        "HTML fiyat alanları",
        "hata",
        `
        <b>Eksik alanlar:</b><br>
        ${eksik.join("<br>")}<br><br>

        <b>SORUNUN YERİ:</b>
        index.html
        `
      );
    }

    return kutu(
      "HTML fiyat alanları",
      "ok",
      `
      Beklenen 20 fiyat alanının tamamı mevcut.
      `
    );

  }catch(e){

    sorun("index.html");

    return kutu(
      "index.html",
      "hata",
      `
      ${e.message}
      `
    );
  }
}


/* =====================================================
   GERÇEK SAYFAYI TEST ET
===================================================== */

function gercekSayfaTest(){

  return new Promise(resolve => {

    frame.onload = function(){

      try{

        const doc =
          frame.contentDocument ||
          frame.contentWindow.document;

        const kontroller = {

          "HAS alış":
            "hasAltinAlis",

          "HAS satış":
            "hasAltinSatis",

          "22 ayar alış":
            "ayar22Alis",

          "22 ayar satış":
            "ayar22Satis",

          "Yeni çeyrek alış":
            "ceyrekYeniAlis",

          "Yeni çeyrek satış":
            "ceyrekYeniSatis",

          "Yeni yarım alış":
            "yarimYeniAlis",

          "Yeni yarım satış":
            "yarimYeniSatis",

          "Yeni tam alış":
            "tamYeniAlis",

          "Yeni tam satış":
            "tamYeniSatis",

          "USD alış":
            "dolarAlis",

          "USD satış":
            "dolarSatis",

          "EUR alış":
            "euroAlis",

          "EUR satış":
            "euroSatis"

        };

        let bos=[];
        let dolu=[];

        for(const ad in kontroller){

          const el =
            doc.getElementById(
              kontroller[ad]
            );

          if(!el){

            bos.push(
              ad + " → ID bulunamadı"
            );

            continue;
          }

          const metin =
            (el.textContent || "").trim();

          if(
            !metin ||
            metin === "-" ||
            metin === "0"
          ){

            bos.push(
              ad + " → BOŞ"
            );

          }else{

            dolu.push(
              ad + " → " + metin
            );
          }
        }

        if(bos.length){

          sorun("index.html");

          resolve(
            kutu(
              "Gerçek fiyat ekranı",
              "hata",
              `
              <b>Boş veya çalışmayan alanlar:</b><br>
              ${bos.join("<br>")}<br><br>

              <b>DOLU ALANLAR:</b><br>
              ${dolu.join("<br>")}<br><br>

              <b>SORUNUN YERİ:</b>
              index.html<br><br>

              <b>YAPILACAK:</b>
              JavaScript'in fiyatları HTML alanlarına
              yazması kontrol edilmeli.
              `
            )
          );

          return;
        }

        resolve(
          kutu(
            "Gerçek fiyat ekranı",
            "ok",
            `
            Fiyat alanları gerçekten dolu.<br><br>

            <b>Kontrol edilen fiyatlar:</b><br>
            ${dolu.join("<br>")}
            `
          )
        );

      }catch(e){

        resolve(
          kutu(
            "Gerçek fiyat ekranı",
            "uyari",
            `
            Sayfa açıldı fakat içerik okunamadı.<br><br>

            Bunun sebebi tarayıcı güvenlik kısıtlaması
            olabilir.<br><br>

            <b>HATA:</b>
            ${e.message}
            `
          )
        );
      }
    };

    frame.onerror = function(){

      sorun("index.html");

      resolve(
        kutu(
          "Gerçek fiyat ekranı",
          "hata",
          `
          index.html yüklenemedi.
          `
        )
      );
    };

    frame.src =
      "/index.html?frameTest=" + Date.now();

  });
}


/* =====================================================
   JAVASCRIPT KOD KONTROLÜ
===================================================== */

function javascriptTest(){

  const html =
    window.indexKod || "";

  const gerekenler = [

    "/api/sukob",
    "karlar",
    "canliYukle",
    "setInterval",
    "hasAltinAlis",
    "dolarAlis",
    "euroAlis"

  ];

  const eksik =
    gerekenler.filter(
      x => !html.includes(x)
    );

  if(eksik.length){

    sorun("index.html");

    return kutu(
      "JavaScript bağlantıları",
      "hata",
      `
      <b>Eksik:</b><br>
      ${eksik.join("<br>")}<br><br>

      <b>SORUNUN YERİ:</b>
      index.html
      `
    );
  }

  return kutu(
    "JavaScript bağlantıları",
    "ok",
    `
    API, Firebase, fiyat yükleme,
    otomatik yenileme ve HTML bağlantıları bulundu.
    `
  );
}


/* =====================================================
   SON GÜNCELLEME TESTİ
===================================================== */

function guncellemeTest(){

  const html =
    window.indexKod || "";

  const adaylar = [

    "sonGuncelleme",
    "sonGuncelle",
    "lastUpdate",
    "guncelleme"

  ];

  const bulunan =
    adaylar.filter(
      x => html.toLowerCase().includes(
        x.toLowerCase()
      )
    );

  if(!bulunan.length){

    return kutu(
      "Son güncelleme sistemi",
      "uyari",
      `
      Son güncelleme alanı/kodu kesin olarak bulunamadı.<br><br>

      <b>Kontrol edilmesi gereken dosya:</b>
      index.html
      `
    );
  }

  return kutu(
    "Son güncelleme sistemi",
    "ok",
    `
    Güncelleme ile ilgili kod bulundu:<br>
    ${bulunan.join(", ")}
    `
  );
}


/* =====================================================
   ANA SİSTEM
===================================================== */

async function baslat(){

  ilkSorun = null;

  sonucAlani.innerHTML = "";

  durum.innerHTML =
    "🔄 Sistem baştan sona kontrol ediliyor...";

  let rapor = "";

  rapor += kutu(
    "Site",
    "ok",
    "Diagnostic sayfası çalışıyor."
  );

  rapor += await apiTest();

  rapor += sukobUrunTest();

  rapor += await firebaseTest();

  rapor += await indexTest();

  rapor += javascriptTest();

  rapor += guncellemeTest();

  durum.innerHTML =
    "🔄 Gerçek fiyat ekranı test ediliyor...";

  sonucAlani.innerHTML = rapor;

  const gercek =
    await gercekSayfaTest();

  sonucAlani.innerHTML += gercek;


  /* =====================================================
     SON RAPOR
  ===================================================== */

  if(ilkSorun){

    sonucAlani.innerHTML += `
      <div class="sonuc">

        🔴 <b>SİSTEMDE SORUN BULUNDU</b>

        <br><br>

        <b>İlk tespit edilen sorun:</b><br>

        ${ilkSorun}

        <br><br>

        Sistem zinciri:

        <br><br>

        SUKOB
        →
        API
        →
        VERİ
        →
        FIREBASE
        →
        KÂR AYARI
        →
        JAVASCRIPT
        →
        HTML
        →
        GERÇEK EKRAN

        <br><br>

        <b>Önemli:</b>
        Yukarıdaki ilk kırmızı kayıt,
        sorunun başlangıç noktasıdır.

      </div>
    `;

    durum.innerHTML =
      "🔴 Sistem kontrolünde sorun bulundu.";

  }else{

    sonucAlani.innerHTML += `
      <div class="sonuc">

        🟢 <b>TÜM SİSTEM NORMAL</b>

        <br><br>

        SUKOB ✓<br>
        API ✓<br>
        Ürün verileri ✓<br>
        Firebase ✓<br>
        Kâr sistemi ✓<br>
        JavaScript ✓<br>
        HTML ✓<br>
        Gerçek fiyat ekranı ✓

        <br><br>

        <b>Fiyat sisteminde teşhis edilen
        bir sorun yok.</b>

      </div>
    `;

    durum.innerHTML =
      "🟢 Sistem tamamen kontrol edildi.";

  }

}


baslat();

</script>

</body>
</html>
